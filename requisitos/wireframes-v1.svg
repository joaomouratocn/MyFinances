    <text x="72" y="92" class="heading">‹  Setembro 2026  ›</text>
    <rect class="card" x="18" y="112" width="294" height="105" rx="10"/>
    <text x="34" y="140" class="small">SALDO PREVISTO</text>
    <text x="34" y="174" class="title">R$ 2.450,00</text>
    <text x="34" y="199" class="small">Receitas R$ 5.000  •  Despesas R$ 2.550</text>
    <rect class="alert" x="18" y="232" width="294" height="70" rx="9"/>
    <text x="32" y="257" class="heading">3 contas aguardam valor</text>
    <text x="32" y="282" class="text">Revisar contas futuras  →</text>
    <text x="20" y="336" class="heading">Despesas do mês</text>
    <rect class="soft" x="210" y="316" width="102" height="30" rx="15"/>
    <text x="234" y="336" class="small">Filtrar</text>
    <rect class="card" x="18" y="358" width="294" height="66" rx="8"/>
    <text x="32" y="383" class="heading">Aluguel</text><text x="238" y="383" class="heading">R$ 1.200</text>
    <text x="32" y="407" class="small">Moradia • vence dia 10 • Pendente</text>
    <rect class="card" x="18" y="434" width="294" height="66" rx="8"/>
    <text x="32" y="459" class="heading">Notebook 3/10</text><text x="238" y="459" class="heading">R$ 350</text>
    <text x="32" y="483" class="small">Compras • Cartão A • Pendente</text>
    <rect class="button" x="172" y="535" width="140" height="46" rx="23"/>
    <text x="193" y="564" class="white">+ Nova despesa</text>
    <rect class="bar" x="2" y="638" width="326" height="80" rx="0"/>
    <text x="24" y="674" class="heading">⌂</text><text x="104" y="674" class="heading">◷</text><text x="190" y="674" class="heading">▥</text><text x="279" y="674" class="heading">•••</text>
