    <text x="20" y="170" class="small">VALOR</text><rect class="field" x="18" y="180" width="294" height="46" rx="7"/><text x="31" y="209" class="text">R$ 0,00</text>
    <text x="20" y="256" class="small">CATEGORIA</text><rect class="field" x="18" y="266" width="294" height="46" rx="7"/><text x="31" y="295" class="text">Selecionar                           ⌄</text>
    <text x="20" y="342" class="small">COMPRA</text><rect class="field" x="18" y="352" width="140" height="46" rx="7"/><text x="31" y="381" class="text">11/09/2026</text>
    <text x="175" y="342" class="small">VENCIMENTO</text><rect class="field" x="173" y="352" width="139" height="46" rx="7"/><text x="186" y="381" class="text">10/10/2026</text>
    <text x="20" y="428" class="small">FORMA DE PAGAMENTO</text><rect class="field" x="18" y="438" width="294" height="46" rx="7"/><text x="31" y="467" class="text">Selecionar                           ⌄</text>
    <rect class="field" x="18" y="510" width="22" height="22" rx="4"/><text x="52" y="527" class="text">Compra parcelada</text>
    <rect class="field" x="18" y="550" width="22" height="22" rx="4"/><text x="52" y="567" class="text">Conta recorrente</text>
    <rect class="button" x="18" y="630" width="294" height="48" rx="8"/><text x="137" y="660" class="white">Salvar</text>
  </g>

