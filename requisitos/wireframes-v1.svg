    <text x="32" y="116" class="title">Aluguel</text>
    <text x="32" y="153" class="small">VALOR</text><text x="204" y="153" class="heading">R$ 1.200,00</text>
    <text x="32" y="185" class="small">VENCIMENTO</text><text x="204" y="185" class="text">10/09/2026</text>
    <text x="32" y="217" class="small">SITUAÇÃO</text><text x="204" y="217" class="heading">Pendente</text>
    <rect class="button" x="18" y="292" width="294" height="48" rx="8"/><text x="91" y="322" class="white">Marcar como paga</text>
    <rect x="18" y="365" width="294" height="210" rx="12" fill="#fff" stroke="#303840" stroke-width="2"/>
    <text x="40" y="405" class="title">Confirmar pagamento?</text>
    <text x="40" y="440" class="text">Aluguel</text><text x="40" y="466" class="heading">R$ 1.200,00</text>
    <text x="40" y="500" class="small">A data e a hora serão registradas.</text>
    <rect class="soft" x="40" y="524" width="105" height="36" rx="7"/><text x="67" y="547" class="text">Cancelar</text>
    <rect class="button" x="158" y="524" width="130" height="36" rx="7"/><text x="181" y="547" class="white">Confirmar</text>
