<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1760" viewBox="0 0 1600 1760">
  <defs>
    <style>
      .bg { fill: #eef1f4; }
      .phone { fill: #fff; stroke: #20252b; stroke-width: 3; }
      .bar { fill: #e3e7eb; }
      .card { fill: #f7f8fa; stroke: #9ca5af; stroke-width: 1.5; }
      .field { fill: #fff; stroke: #6f7882; stroke-width: 1.5; }
      .button { fill: #303840; }
      .soft { fill: #dce2e7; }
      .alert { fill: #f4f0df; stroke: #aaa070; stroke-width: 1.5; }
      .title { font: 700 22px sans-serif; fill: #171a1d; }
      .heading { font: 700 16px sans-serif; fill: #20252b; }
      .text { font: 14px sans-serif; fill: #363c43; }
      .small { font: 12px sans-serif; fill: #5d6670; }
      .white { font: 700 14px sans-serif; fill: #fff; }
      .label { font: 700 20px sans-serif; fill: #20252b; }
      .line { stroke: #a4acb5; stroke-width: 1.5; }
    </style>
  </defs>
  <rect class="bg" width="1600" height="1760"/>
  <text x="60" y="45" class="title">Minhas Finanças — Wireframes V1</text>
  <text x="60" y="70" class="text">Baixa fidelidade • estrutura e navegação</text>

  <!-- 1 Inicio -->
