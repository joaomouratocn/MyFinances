    <text x="32" y="221" class="small">Previsto para dia 5 • Ativa</text>
    <text x="20" y="286" class="heading">Eventuais do mês</text>
    <rect class="card" x="18" y="302" width="294" height="78" rx="9"/>
    <text x="32" y="331" class="heading">Renda extra</text><text x="226" y="331" class="heading">R$ 400</text>
    <text x="32" y="357" class="small">11/09/2026</text>
    <rect class="card" x="18" y="420" width="294" height="100" rx="9"/>
    <text x="32" y="449" class="small">EDITAR RECEITA FIXA</text>
    <text x="32" y="478" class="text">Editar somente este mês</text>
    <text x="32" y="505" class="text">Editar padrão dos meses futuros</text>
  </g>

  <!-- 8 Pagamento -->
