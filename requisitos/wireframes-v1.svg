    <text x="32" y="501" class="text">Cartão B</text><text x="233" y="501" class="heading">R$ 350</text>
    <rect class="bar" x="2" y="638" width="326" height="80"/>
    <text x="14" y="690" class="small">Início</text><text x="84" y="690" class="small">Futuras</text><text x="165" y="690" class="heading">Relatórios</text><text x="267" y="690" class="small">Mais</text>
