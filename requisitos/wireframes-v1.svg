    <text x="20" y="44" class="heading">‹</text><text x="55" y="44" class="title">Parcelamento</text>
    <rect class="card" x="18" y="72" width="294" height="75" rx="9"/>
    <text x="32" y="101" class="heading">Notebook</text><text x="32" y="126" class="small">Compras • Cartão A</text>
    <text x="20" y="179" class="small">QUANTIDADE DE PARCELAS</text><rect class="field" x="18" y="189" width="294" height="46" rx="7"/><text x="31" y="218" class="text">10</text>
    <text x="20" y="265" class="small">VALOR DE CADA PARCELA</text><rect class="field" x="18" y="275" width="294" height="46" rx="7"/><text x="31" y="304" class="text">R$ 350,00</text>
    <text x="20" y="351" class="small">PRIMEIRO VENCIMENTO</text><rect class="field" x="18" y="361" width="294" height="46" rx="7"/><text x="31" y="390" class="text">10/10/2026</text>
