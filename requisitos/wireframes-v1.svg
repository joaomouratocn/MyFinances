    <rect class="card" x="18" y="156" width="294" height="64" rx="9"/><text x="36" y="195" class="heading">Cartões</text><text x="286" y="195" class="heading">›</text>
    <rect class="card" x="18" y="232" width="294" height="64" rx="9"/><text x="36" y="271" class="heading">Categorias</text><text x="286" y="271" class="heading">›</text>
    <text x="20" y="342" class="small">SEGURANÇA</text>
    <rect class="card" x="18" y="354" width="294" height="80" rx="9"/><text x="36" y="384" class="heading">Bloqueio do dispositivo</text><text x="36" y="410" class="small">Bloquear após 5 minutos</text>
    <text x="20" y="480" class="small">DADOS LOCAIS NESTE DISPOSITIVO</text>
    <rect class="bar" x="2" y="638" width="326" height="80"/>
    <text x="14" y="690" class="small">Início</text><text x="84" y="690" class="small">Futuras</text><text x="165" y="690" class="small">Relatórios</text><text x="267" y="690" class="heading">Mais</text>
